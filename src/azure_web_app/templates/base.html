<!DOCTYPE html>
<html lang="en">

    <link

      rel="stylesheet"
    />
  </head>
  <body>

          <a class="nav-link" href="{{ url_for('memes_page') }}">Meme Time Capsule</a>

    {% block scripts %}{% endblock %}
